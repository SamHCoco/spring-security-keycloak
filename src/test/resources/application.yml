spring:
  application:
    name: spring-keycloak
  output:
    ansi:
      enabled: ALWAYS
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: app
            client-secret: ${KEYCLOAK_CLIENT_SECRET:secret}
            authorization-grant-type: client_credentials
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/master
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/master

keycloak:
  realm: master
  resource: app
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8080}/auth/
  username: ${KEYCLOAK_USER:admin}
  password: ${KEYCLOAK_USER_PASSWORD:admin}
  grant-type: password
  secret: ${KEYCLOAK_CLIENT_SECRET:secret}

server:
  port: 9100